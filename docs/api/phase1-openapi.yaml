openapi: 3.1.0
info:
  title: VBRPG Phase 1 API
  version: 1.0.0
  description: |
    Phase 1 control plane plus the game-runtime surface (`/instances*`).
    Runtime endpoints are session-authenticated, tenant-scoped to the platform
    tenant, and reject client-supplied sequences: the server derives them.
servers:
  - url: /v1
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Authenticated; sets HttpOnly session cookie.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      responses:
        '204': { description: Session revoked; clears cookie. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/csrf:
    get:
      operationId: getCsrfToken
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: CSRF token for state-changing requests.
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: { type: string }
        '401': { $ref: '#/components/responses/Error' }
  /auth/password:
    post:
      operationId: changePassword
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 256 }
                newPassword: { type: string, minLength: 12, maxLength: 256 }
      responses:
        '200':
          description: Password changed; other sessions revoked and CSRF token rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: getCurrentUser
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
  /admin/users:
    get:
      operationId: listUsers
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: User accounts without password or session data.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: array, items: { $ref: '#/components/schemas/User' } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createUser
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, temporaryPassword, role]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                temporaryPassword: { type: string, minLength: 12, maxLength: 256 }
                role: { type: string, enum: [admin, user] }
      responses:
        '201':
          description: Created account; never returns temporary password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}:
    patch:
      operationId: updateUser
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                role: { type: string, enum: [admin, user] }
                active: { type: boolean }
                resetPassword: { type: string, minLength: 12, maxLength: 256 }
      responses:
        '200':
          description: Updated account; role/status/password changes revoke sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /providers:
    get:
      operationId: listEnabledProviders
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Enabled provider/model public metadata, no secret fields.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers: { type: array, items: { $ref: '#/components/schemas/Provider' } }
  /admin/providers:
    get:
      operationId: listProviders
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Provider metadata and secretConfigured only.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers: { type: array, items: { $ref: '#/components/schemas/Provider' } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createProvider
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderInput' }
      responses:
        '201':
          description: Provider created; secret is write-only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/providers/{providerId}:
    patch:
      operationId: updateProvider
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                baseUrl: { type: string, format: uri, maxLength: 2048 }
                enabled: { type: boolean }
                apiKey: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: Updated provider; API key never returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/providers/{providerId}/test:
    post:
      operationId: testProvider
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sanitized connection test outcome.
          content:
            application/json:
              schema:
                type: object
                required: [ok, latencyMs, checkedAt, errorCode]
                properties:
                  ok: { type: boolean }
                  latencyMs: { type: integer, minimum: 0, maximum: 8000 }
                  checkedAt: { type: string, format: date-time }
                  errorCode: { type: [string, 'null'], enum: [null, timeout, dns_rejected, tls_error, unauthorized, rate_limited, provider_error, invalid_response] }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/providers/{providerId}/models:
    post:
      operationId: createProviderModel
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [modelId, displayName]
              properties:
                modelId: { type: string, minLength: 1, maxLength: 200 }
                displayName: { type: string, minLength: 1, maxLength: 100 }
                enabled: { type: boolean, default: true }
      responses:
        '201':
          description: Model created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderModel' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/models/{modelId}:
    patch:
      operationId: updateProviderModel
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      parameters:
        - { name: modelId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                modelId: { type: string, minLength: 1, maxLength: 200 }
                displayName: { type: string, minLength: 1, maxLength: 100 }
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated model.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderModel' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /instances:
    post:
      operationId: createInstance
      summary: Create an instance from a workflow definition and dispatch instanceCreated.
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameVersionId]
              additionalProperties: false
              properties:
                gameVersionId: { type: string }
                randomSeed: { type: string, minLength: 1 }
                participants: { type: array, items: { type: object, additionalProperties: true } }
                variables: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Instance created; commands are the external commands the transition produced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceTransition' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: No workflow definition exists for that game version. }
        '429': { description: Too many instances created by this account recently. }
  /instances/{instanceId}:
    get:
      operationId: getInstance
      summary: Authoritative state, including hidden information; administrators only.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: instanceId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Authoritative instance state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /instances/{instanceId}/view:
    get:
      operationId: getInstanceView
      summary: Projection for one participant, filtered by the definition's visibility rules.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: instanceId, in: path, required: true, schema: { type: string } }
        - { name: participantId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Public and private projections for that seat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerView' }
        '400': { description: participantId is missing. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: The seat belongs to another account and the caller is not an administrator. }
        '404': { description: Unknown instance or unknown participant. }
  /instances/{instanceId}/events:
    post:
      operationId: submitGameEvent
      summary: Submit player input; sequence and event id are server-derived.
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      parameters:
        - { name: instanceId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, payload]
              additionalProperties: false
              properties:
                type: { type: string, enum: [playerInputReceived] }
                payload:
                  type: object
                  additionalProperties: true
                  description: playerInputReceived requires participantId and value.
      responses:
        '200':
          description: Event applied, or replayed when the idempotency key was already recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceTransition' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: The event conflicts with the current instance state; body carries the engine code. }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: vbrpg_session }
    csrfHeader: { type: apiKey, in: header, name: x-csrf-token }
  schemas:
    User:
      type: object
      required: [id, username, role, active, mustChangePassword, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        active: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
    LoginResult:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    Provider:
      type: object
      required: [id, name, baseUrl, enabled, secretConfigured, models]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        baseUrl: { type: string, format: uri }
        enabled: { type: boolean }
        secretConfigured: { type: boolean }
        models: { type: array, items: { $ref: '#/components/schemas/ProviderModel' } }
    ProviderInput:
      type: object
      additionalProperties: false
      required: [name, baseUrl, apiKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        baseUrl: { type: string, format: uri, maxLength: 2048 }
        apiKey: { type: string, minLength: 1, maxLength: 4096 }
    ProviderModel:
      type: object
      required: [id, providerId, modelId, displayName, enabled]
      properties:
        id: { type: string, format: uuid }
        providerId: { type: string, format: uuid }
        modelId: { type: string }
        displayName: { type: string }
        enabled: { type: boolean }
    InstanceTransition:
      type: object
      required: [state, commands]
      properties:
        state: { type: object, additionalProperties: true }
        commands: { type: array, items: { type: object, additionalProperties: true } }
        replayed: { type: boolean }
    PlayerView:
      type: object
      required: [instanceId, gameVersionId, sequence, status, publicState, privateState, availableActions]
      properties:
        instanceId: { type: string }
        gameVersionId: { type: string }
        sequence: { type: integer, minimum: 0 }
        status: { type: string }
        publicState: { type: object, additionalProperties: true }
        privateState: { type: object, additionalProperties: true }
        availableActions:
          type: array
          items:
            type: object
            required: [actionId, input]
            properties:
              actionId: { type: string }
              input: { type: object, additionalProperties: true }
    InstanceView:
      type: object
      required: [instanceId, status, currentSequence, state]
      properties:
        instanceId: { type: string }
        status: { type: string, enum: [created, running, waiting, paused, completed, cancelled] }
        currentSequence: { type: integer, minimum: 0 }
        state: { type: object, additionalProperties: true }
    AgentModelBinding:
      type: object
      additionalProperties: false
      required: [providerModelId]
      properties:
        providerModelId: { type: string, format: uuid }
    Error:
      type: object
      required: [error, code, details, requestId]
      properties:
        error: { type: string }
        code: { type: string }
        details: { type: object }
        requestId: { type: string }
  responses:
    Error:
      description: Standard platform error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

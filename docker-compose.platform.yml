# One image, two roles: the api role also serves the browser bundle, so everything is same-origin.
services:
  platform-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vbrpg_platform
      POSTGRES_USER: vbrpg
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-vbrpgpassword}
    ports:
      - "5433:5432"
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbrpg -d vbrpg_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform-migrate:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    image: vbrpg-platform:local
    command: ["pnpm", "--filter", "@vbrpg/platform", "migrate"]
    environment:
      DATABASE_URL: postgres://vbrpg:${PLATFORM_POSTGRES_PASSWORD:-vbrpgpassword}@platform-postgres:5432/vbrpg_platform
    depends_on:
      platform-postgres:
        condition: service_healthy
    restart: "no"

  platform:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    image: vbrpg-platform:local
    ports:
      - "8080:3000"
    environment:
      # Local HTTP testing: production requires https origins and Secure cookies.
      NODE_ENV: development
      PORT: "3000"
      LOG_LEVEL: ${PLATFORM_LOG_LEVEL:-info}
      DATABASE_URL: postgres://vbrpg:${PLATFORM_POSTGRES_PASSWORD:-vbrpgpassword}@platform-postgres:5432/vbrpg_platform
      PLATFORM_CREDENTIAL_KEY: ${PLATFORM_CREDENTIAL_KEY:-}
      # Same origin now: the console is served by this process.
      TRUSTED_WEB_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12

  platform-worker:
    image: vbrpg-platform:local
    command: ["node", "apps/platform/dist/server/main.js", "--role=worker"]
    environment:
      DATABASE_URL: postgres://vbrpg:${PLATFORM_POSTGRES_PASSWORD:-vbrpgpassword}@platform-postgres:5432/vbrpg_platform
    depends_on:
      platform-migrate:
        condition: service_completed_successfully

volumes:
  platform_postgres_data:

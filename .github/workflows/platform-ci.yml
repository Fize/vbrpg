name: platform-ci

on:
  push:
    paths:
      - "apps/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "apps/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vbrpg_platform
          POSTGRES_USER: vbrpg
          POSTGRES_PASSWORD: vbrpgpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vbrpg -d vbrpg_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run migrate
        env:
          DATABASE_URL: postgres://vbrpg:vbrpgpassword@localhost:5432/vbrpg_platform
      - run: pnpm run test:db
        env:
          DATABASE_URL: postgres://vbrpg:vbrpgpassword@localhost:5432/vbrpg_platform
      # Down migrations must be runnable, not just documented.
      - run: pnpm run migrate:down -- --steps=1
        env:
          DATABASE_URL: postgres://vbrpg:vbrpgpassword@localhost:5432/vbrpg_platform
      - run: pnpm run migrate
        env:
          DATABASE_URL: postgres://vbrpg:vbrpgpassword@localhost:5432/vbrpg_platform
      # Advisory report only: the repository already carries open high-severity
      # findings in production dependency chains. Review before release.
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true
      - run: pnpm --filter @vbrpg/platform exec playwright install --with-deps chromium
      # The browser suite drives the console against a real server, and its first case is the
      # forced password change, so it needs exactly one freshly bootstrapped administrator.
      - run: pnpm bootstrap-admin -- --username e2e-root --password 'initial-password-1'
        env:
          DATABASE_URL: postgres://vbrpg:vbrpgpassword@localhost:5432/vbrpg_platform
      - run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgres://vbrpg:vbrpgpassword@localhost:5432/vbrpg_platform
          # Test-only master key (32 zero bytes); CI never touches a real credential.
          E2E_CREDENTIAL_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
